name: Deploy Folvella to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rebuild static site
        run: python3 scripts/build.py
      - name: Rebuild Pinterest catalog
        run: python3 scripts/build_all_pins.py
      - name: Rebuild Pinterest kit
        run: python3 scripts/build_pin_kit.py
      - name: Apply configured site base
        run: python3 scripts/rewrite_site_base.py
      - name: Validate publication
        run: python3 scripts/validate.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
