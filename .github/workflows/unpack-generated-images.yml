name: Unpack Trendora AI images

on:
  push:
    branches: [main]
    paths:
      - 'assets/generated-pack.tgz'
      - '.github/workflows/unpack-generated-images.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack generated images
        run: |
          mkdir -p assets/generated
          tar -xzf assets/generated-pack.tgz -C assets/generated
          rm -f assets/generated-pack.tgz
          rm -f .github/workflows/unpack-generated-images.yml
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Trendora AI-generated cover images"
          git push
